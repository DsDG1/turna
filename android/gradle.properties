# Pin Gradle to JDK 21.0.1 (Oracle HotSpot) to dodge a JIT crash in
# Microsoft OpenJDK 17.0.8.1 (see android/hs_err_pid*.log) where the C2
# compiler SIGSEGVs while compiling DefaultMultiProcessSafeIndexedCache.
# AGP 8.11.1 + Kotlin 2.2.20 + Gradle 8.14 are all officially supported on JDK 21.
org.gradle.java.home=C:/Program Files/Java/jdk-21
org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
