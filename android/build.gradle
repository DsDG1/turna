buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Workaround for older plugins that don't specify an Android namespace.
    // AGP 8.x requires every module to declare a namespace. Some packages on
    // pub.dev (e.g. flutter_custom_dialog) were published before this
    // requirement and only set the package in AndroidManifest.xml. This block
    // copies the Gradle group (which matches the manifest package) into the
    // namespace when missing.
    project.afterEvaluate {
        if (project.hasProperty("android")) {
            project.android {
                if (namespace == null || namespace.isEmpty()) {
                    namespace project.group.toString()
                }
                compileSdkVersion 36
                defaultConfig {
                    targetSdkVersion 36
                }
            }
        }

        // Workaround: Kotlin metadata version mismatch between Kotlin 2.2.x
        // stdlib and older compiler versions still shipped in some plugins.
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            compilerOptions {
                freeCompilerArgs.add("-Xskip-metadata-version-check")
            }
        }
    }

    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
