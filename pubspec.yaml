name: turna
version: 0.7.0+1
publish_to: 'none'
environment:
  sdk: ">=3.2.3 <4.0.0"
description: Turna - Local-first Turkish language learning
dependencies:
  archive: ^4.0.9
  audioplayers: ^6.0.0
  auto_route: ^11.1.0
  crypto: ^3.0.7
  cupertino_icons: ^1.0.2
  drift: ^2.22.1
  file_picker: ^8.1.4
  ffi: ^2.2.0
  fl_chart: ^0.69.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  flutter_secure_storage: ^9.2.4
  flutter_tts: ^4.0.2
  freezed_annotation: ^3.1.0
  fsrs: ^2.0.1
  get_it: ^9.2.1
  google_fonts: ^8.1.0
  http: ^1.2.0
  injectable: ^3.0.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.4.0
  package_info_plus: ^9.0.1
  path: ^1.9.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  share_plus: ^10.0.0
  # Direct dep: remote backup reads prefs values untyped (sp.get) on top of
  # streaming_shared_preferences, which only exposes typed getters.
  shared_preferences: ^2.2.3
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  streaming_shared_preferences: ^2.0.0
  url_launcher: ^6.3.2
  # Fidelity WebView for the Anki deep-adaptation track (阶段 2). Federated -
  # only Android/iOS have a platform implementation; on HarmonyOS/desktop/web
  # AnkiHtmlCardView degrades to a text fallback (decision 4) and never
  # instantiates a WebViewController.
  webview_flutter: ^4.10.0
dev_dependencies:
  auto_route_generator: ^10.5.0
  build_runner: ^2.4.12
  drift_dev: ^2.22.1
  freezed: ^3.2.5
  flutter_gen: ^5.15.0
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  import_sorter: ^4.6.0
  path_provider_platform_interface: ^2.1.2
  injectable_generator: ^3.0.2
  json_serializable: ^6.8.0
  pubspec_dependency_sorter: ^1.0.5
dependency_overrides:
  # OHos (HarmonyOS) platform implementations from openharmony-tpc community.
  # See https://juejin.cn/post/7651831144142897178 for the adaptation catalog.
  shared_preferences:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: br_shared_preferences-v2.5.3_ohos
  path_provider:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos
  url_launcher:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/url_launcher/url_launcher
      ref: br_url_launcher-v6.3.2_ohos
  package_info_plus:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_plus_plugins.git
      path: packages/package_info_plus/package_info_plus
  share_plus:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_plus_plugins.git
      path: packages/share_plus/share_plus
  file_picker:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_file_picker.git
  flutter_local_notifications:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_flutter_local_notifications.git
      path: flutter_local_notifications
  # win32 3.x+ uses UnmodifiableUint8ListView, which the OHos Flutter SDK's
  # Dart 3.6.2 runtime is missing from dart:typed_data. Pin to 2.7.0 which
  # predates that API. Only needed on Windows host for native build helpers.
  win32: 2.7.0
  # flutter_secure_storage 9.x pulls flutter_secure_storage_windows ^3.1.2,
  # which declares win32 ^5.0.0 and won't compile against the pinned 2.7.0.
  # The OHos kernel snapshot compiles every platform implementation, so the
  # Windows package must build. 2.1.1 drops the win32 dep (raw FFI) and still
  # implements flutter_secure_storage_platform_interface ^1.0.1; on Android/
  # OHos it is resolved but never instantiated at runtime.
  flutter_secure_storage_windows: 2.1.1
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
    - assets/images/turna/
    - assets/images/mala/
    - assets/courses/
    - assets/courses/turkish/
    - assets/courses/turkish/sections/
    - assets/changelog.md
    - assets/anki_reviewer/
    - assets/anki_reviewer/mathjax/
flutter_gen:
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/images/app_logo.png
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/app_logo.png
    background_color: "#FFFFFF"
    theme_color: "#1F727E"
  windows:
    generate: true
    image_path: assets/images/app_logo.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/images/app_logo.png
