name: varnamala
version: 1.0.0+1
publish_to: 'none'
environment:
  sdk: ">=3.2.3 <4.0.0"
description: Varnamala - Local-first language learning (Swahili)
dependencies:
  audioplayers: ^6.0.0
  auto_route: 9.2.2
  cupertino_icons: ^1.0.2
  drift: ^2.16.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  flutter_tts: ^4.0.2
  freezed_annotation: ^2.4.1
  get_it: ^7.7.0
  google_fonts: ^6.2.0
  injectable: ^2.4.2
  intl: ^0.19.0
  json_annotation: ^4.9.0
  logger: ^2.4.0
  package_info_plus: ^9.0.1
  path: ^1.9.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  share_plus: ^10.0.0
  sherpa_onnx: ^1.13.4
  sqlite3_flutter_libs: ^0.5.24
  streaming_shared_preferences: ^2.0.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
dev_dependencies:
  auto_route_generator: ^9.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.16.0
  freezed: ^2.5.2
  flutter_gen: 5.8.0
  flutter_gen_runner: 5.8.0
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  import_sorter: ^4.6.0
  injectable_generator: ^2.6.1
  json_serializable: ^6.8.0
  pubspec_dependency_sorter: ^1.0.5
  shared_preferences: ^2.2.3
  sqlite3: ^2.4.0
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/sounds/swahili/listening/
    - assets/images/
    - assets/images/mala/
    - assets/courses/
    - assets/courses/swahili/
    - assets/courses/swahili/sections/
    # Piper Swahili TTS model + espeak-ng data.
    # Flutter only includes *direct* files of each listed directory (no recursion),
    # so every nested folder that holds files must be declared explicitly.
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/aav/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/art/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/azc/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/bat/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/bnt/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/ccs/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/cel/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/cus/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/dra/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/esx/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/gmq/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/gmw/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/grk/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/inc/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/ine/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/ira/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/iro/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/itc/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/jpx/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/map/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/miz/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/myn/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/poz/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/roa/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/sai/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/sem/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/sit/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/tai/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/trk/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/urj/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/zle/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/zls/
    - assets/voices/swahili/vits-piper-sw_CD-lanfrica-medium-int8/espeak-ng-data/lang/zlw/
flutter_gen:
  # The Piper TTS model + espeak-ng-data are read via rootBundle / AssetManifest
  # at runtime (see piper_swahili_tts.dart) and never referenced through the
  # generated `Assets` class. Exclude them from flutter_gen so it does not try
  # to mint Dart getters from the asset leaf names — some espeak language
  # files are named after Dart keywords (`is`, `as`) and would produce a
  # non-compiling assets.gen.dart (e.g. `String get is => ...`).
  assets:
    exclude:
      - assets/voices/**
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/images/app_logo.png
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/app_logo.png
    background_color: "#FFFFFF"
    theme_color: "#1F727E"
  windows:
    generate: true
    image_path: assets/images/app_logo.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/images/app_logo.png
