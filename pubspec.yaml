name: words625
version: 1.0.0+1
publish_to: 'none'
environment:
  sdk: ">=3.2.3 <4.0.0"
description: Varnamala - A Duolingo Alternative for Learning Indian Languages
dependencies:
  audioplayers: ^6.0.0
  auto_route: 9.2.2
  cupertino_icons: ^1.0.2
  drift: ^2.16.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  flutter_tts: ^4.0.2
  freezed: ^2.5.2
  freezed_annotation: ^2.4.1
  get_it: ^7.7.0
  google_fonts: ^6.2.0
  http: ^1.2.2
  injectable: ^2.4.2
  intl: ^0.19.0
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  logger: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  sqlite3_flutter_libs: ^0.5.24
  streaming_shared_preferences: ^2.0.0
  url_launcher: ^6.3.2
dev_dependencies:
  auto_route_generator: ^9.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.16.0
  flutter_gen: 5.8.0
  flutter_gen_runner: 5.8.0
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  import_sorter: ^4.6.0
  injectable_generator: ^2.6.1
  pubspec_dependency_sorter: ^1.0.5
  shared_preferences: ^2.2.3
  sqlite3: ^2.4.0
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icons/
    - assets/images/
    - assets/images/mala/
    - assets/courses/
    - assets/courses/swahili/
    - assets/courses/swahili/sections/
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/images/app_logo.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/images/app_logo.png
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: assets/images/app_logo.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/images/app_logo.png