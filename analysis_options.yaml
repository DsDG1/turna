# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - '**/*.gr.dart'
    - 'lib/gen/**'
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Vendored upstream Flutter packages (ADR 0047 §7.1). Excluded from lint, not
    # from compilation: they are held to upstream's own style, and our lint set
    # would report thousands of diagnostics in code we do not own. That they
    # *compile* under the pinned official SDK is the property that matters, and
    # `flutter test` proves it because every test compiles the whole app.
    - 'third_party/**'
  errors:
    # `@JsonKey` is legal on freezed constructor parameters — the analyzer
    # flags it as `invalid_annotation_target` because it sees the parameter
    # as a getter. Suppress so hand-written freezed sources stay clean.
    invalid_annotation_target: ignore

linter:
  rules:
    # Hygiene / safety (low noise, high value)
    avoid_print: true
    cancel_subscriptions: true
    close_sinks: true
    unnecessary_late: true
    unawaited_futures: true
    # Prefer const where the analyzer is confident; noisy const-everywhere
    # rules left off until a dedicated cleanup pass.
    prefer_const_declarations: true
