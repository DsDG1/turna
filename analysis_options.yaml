# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - '**/*.gr.dart'
    - 'lib/gen/**'
  errors:
    # `@JsonKey` is legal on freezed constructor parameters — the analyzer
    # flags it as `invalid_annotation_target` because it sees the parameter
    # as a getter. Suppress so hand-written freezed sources stay clean.
    invalid_annotation_target: ignore

linter:
  rules:
    # Hygiene / safety (low noise, high value)
    avoid_print: true
    cancel_subscriptions: true
    close_sinks: true
    unnecessary_late: true
    # Prefer const where the analyzer is confident; noisy const-everywhere
    # rules left off until a dedicated cleanup pass.
    prefer_const_declarations: true
