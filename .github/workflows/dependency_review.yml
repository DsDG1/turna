name: Dependency Review

# Flags known vulnerabilities in dependency changes (pubspec.lock diff)
# on pull requests only; zero config, no secret required.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
