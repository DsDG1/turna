name: GUI Release

# Builds the PySide6 course editor into a onefile exe and attaches it to a
# GitHub Release. GUI changes pushed to master create a numbered prerelease;
# pushing a `gui-v*` tag creates a regular release. workflow_dispatch runs the
# same pipeline but only uploads a build artifact (no release is created).
on:
  push:
    branches:
      - master
    tags:
      - "gui-v*"
    paths:
      - "tool/gui/**"
      - "tool/course_cli.py"
      - ".github/workflows/gui_release.yml"
  workflow_dispatch:

permissions:
  contents: write # required to create the GitHub Release (tag builds only)

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tool/gui/pyproject.toml

      - name: Install GUI editor dependencies
        # The `ocr` and `voice` extras MUST be installed: the shipped exe
        # bundles those modules (see turna_gui.spec hiddenimports), and
        # without them PyInstaller would either fail the build or ship an
        # exe whose OCR / voice features are silently unavailable.
        run: python -m pip install "./tool/gui[dev,ocr,voice]" pyinstaller

      - name: Resolve and stamp the build version
        # The exe reads its version from pyproject.toml (single source). Branch
        # pushes get a unique prerelease tag and a four-part Windows version;
        # re-running the same workflow keeps both stable. A `gui-v*` tag remains
        # the version source for regular releases.
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $releaseTag = $env:GITHUB_REF_NAME
            $version = $releaseTag.Substring(5)
          } elseif ($env:GITHUB_EVENT_NAME -eq "push") {
            $releaseTag = "gui-build-$($env:GITHUB_RUN_NUMBER)"
            $version = "0.0.0.$($env:GITHUB_RUN_NUMBER)"
          } else {
            $releaseTag = ""
            $version = python -c "import sys; sys.path.insert(0, 'tool/gui'); import build_gui; print(build_gui.read_version())"
          }
          python -c "import sys; sys.path.insert(0, 'tool/gui'); import build_gui; build_gui.stamp_version(sys.argv[1])" $version
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Lint GUI editor (ruff)
        run: ruff check tool/gui

      - name: Enforce GUI layering + ratchet contract
        # Must match the flags in .github/workflows/flutter_ci.yml and
        # `make guard-gui` — a split baseline would let one gate go green
        # while another goes red. Rationale per metric:
        # tool/gui/docs/ai_refactor_contract.md
        # ratchet baselines: tool/gui/tool/guard_limits.json (single source)
        # --fail-app-dialogs is intentionally not enabled: the contract
        # treats application -> dialogs as known debt (13 edges,
        # composition-root only). Its ceiling is max_app_dialogs_imports.
        run: |
          python tool/gui/tool/check_ai_boundaries.py --fail-private --fail-dialogs-app --fail-backend-app --fail-backend-ui --fail-backend-qt --fail-dialogs-pipeline --fail-undeclared-host-access --fail-course-cli-binding
          python tool/gui/tool/gen_module_tree.py --check
          python tool/gui/tool/check_docs_index.py --quiet

      - name: Configure git identity for GUI library tests
        # Runner images ship no global git identity; test_git_library's
        # commit/push roundtrip needs one.
        run: |
          git config --global user.name "turna-ci"
          git config --global user.email "ci@turna.invalid"

      # Full tier (not `ci`): the exe this workflow ships is the artifact
      # users actually download, so it must clear the same suite as a PR —
      # not a weaker one. Matches `make test-gui`.
      - name: Run GUI editor tests (full tier)
        working-directory: tool/gui
        env:
          QT_QPA_PLATFORM: offscreen
        run: python run_gui_tests.py full -j 4

      - name: Build onefile exe
        run: python tool/gui/build_gui.py --clean

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: turna-gui-exe
          path: dist/turna-gui.exe

      - name: Attach exe to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Turna GUI ${{ env.RELEASE_VERSION }}
          files: dist/turna-gui.exe
          prerelease: ${{ github.ref_type == 'branch' }}
          generate_release_notes: true
