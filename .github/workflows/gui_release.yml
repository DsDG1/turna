name: GUI Release

# Builds the PySide6 course editor into a onefile exe and attaches it to a
# GitHub Release. Push a `gui-v*` tag to ship; workflow_dispatch runs the same
# pipeline but only uploads a build artifact (no release is created).
on:
  push:
    tags:
      - "gui-v*"
  workflow_dispatch:

permissions:
  contents: write # required to create the GitHub Release (tag builds only)

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tool/gui/pyproject.toml

      - name: Install GUI editor dependencies
        # The `ocr` and `voice` extras MUST be installed: the shipped exe
        # bundles those modules (see turna_gui.spec hiddenimports), and
        # without them PyInstaller would either fail the build or ship an
        # exe whose OCR / voice features are silently unavailable.
        run: python -m pip install "./tool/gui[dev,ocr,voice]" pyinstaller

      - name: Stamp the version into pyproject.toml
        # The exe reads its version from pyproject.toml (single source). A
        # `gui-v*` tag must therefore write the version back, or every
        # shipped exe reports 0.0.0 and a bug report cannot be tied to a
        # build.
        run: |
          $tag = "${GITHUB_REF_NAME}"
          if ($tag -like "gui-v*") {
            $version = $tag.Substring(6)
            python -c "import pathlib, re, sys; p = pathlib.Path('tool/gui/pyproject.toml'); t = p.read_text(encoding='utf-8'); v = sys.argv[1]; p.write_text(re.sub(r'(?m)^version\s*=\s*\"[^\"]+\"', f'version = \"{v}\"', t, count=1), encoding='utf-8'); print('stamped', v)" $version
          } else {
            python -c "import pathlib, re; p = pathlib.Path('tool/gui/pyproject.toml'); t = p.read_text(encoding='utf-8'); m = re.search(r'(?m)^version\s*=\s*\"([^\"]+)\"', t); print('workflow_dispatch: version', m.group(1) if m else '0.0.0')"
          }

      - name: Lint GUI editor (ruff)
        run: ruff check tool/gui

      - name: Enforce GUI layering + ratchet contract
        # Must match the flags in .github/workflows/flutter_ci.yml and
        # `make guard-gui` — a split baseline would let one gate go green
        # while another goes red. Rationale per metric:
        # tool/gui/docs/ai_refactor_contract.md
        run: |
          python tool/gui/tool/check_ai_boundaries.py \
            --fail-private --fail-dialogs-app --fail-backend-app \
            --fail-backend-ui --fail-backend-qt --fail-dialogs-pipeline \
            --fail-undeclared-host-access \
            --fail-course-cli-binding
            # ratchet baselines: tool/gui/tool/guard_limits.json (single source)
            # --fail-app-dialogs is intentionally not enabled: the contract
            # treats application -> dialogs as known debt (13 edges,
            # composition-root only). Its ceiling is max_app_dialogs_imports.
          python tool/gui/tool/gen_module_tree.py --check
          python tool/gui/tool/check_docs_index.py --quiet

      # Full tier (not `ci`): the exe this workflow ships is the artifact
      # users actually download, so it must clear the same suite as a PR —
      # not a weaker one. Matches `make test-gui`.
      - name: Run GUI editor tests (full tier)
        working-directory: tool/gui
        env:
          QT_QPA_PLATFORM: offscreen
        run: python run_gui_tests.py full -j 4

      - name: Build onefile exe
        run: python tool/gui/build_gui.py --clean

      - name: Upload exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: turna-gui-exe
          path: dist/turna-gui.exe

      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/gui-v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/turna-gui.exe
          generate_release_notes: true
