name: GUI Release

# Builds the PySide6 course editor into a onefile exe and attaches it to a
# GitHub Release. Push a `gui-v*` tag to ship; workflow_dispatch runs the same
# pipeline but only uploads a build artifact (no release is created).
on:
  push:
    tags:
      - "gui-v*"
  workflow_dispatch:

permissions:
  contents: write # required to create the GitHub Release (tag builds only)

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tool/gui/pyproject.toml

      - name: Install GUI editor dependencies
        run: python -m pip install "./tool/gui[dev]" pyinstaller

      - name: Lint GUI editor (ruff)
        run: ruff check tool/gui

      - name: Enforce GUI layering + ratchet contract
        # Must match the flags in .github/workflows/flutter_ci.yml and
        # `make guard-gui` — a split baseline would let one gate go green
        # while another goes red. Rationale per metric:
        # tool/gui/docs/ai_refactor_contract.md
        run: |
          python tool/gui/tool/check_ai_boundaries.py \
            --fail-private --fail-dialogs-app --fail-backend-app \
            --fail-backend-ui --fail-backend-qt --fail-dialogs-pipeline \
            --fail-undeclared-host-access \
            --fail-course-cli-binding
            # ratchet baselines: tool/gui/tool/guard_limits.json (single source)
          python tool/gui/tool/gen_module_tree.py --check
          python tool/gui/tool/check_docs_index.py --quiet

      # Full tier (not `ci`): the exe this workflow ships is the artifact
      # users actually download, so it must clear the same suite as a PR —
      # not a weaker one. Matches `make test-gui`.
      - name: Run GUI editor tests (full tier)
        working-directory: tool/gui
        env:
          QT_QPA_PLATFORM: offscreen
        run: python run_gui_tests.py full -j 4

      - name: Build onefile exe
        run: python tool/gui/build_gui.py --clean

      - name: Upload exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: turna-gui-exe
          path: dist/turna-gui.exe

      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/gui-v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/turna-gui.exe
          generate_release_notes: true
