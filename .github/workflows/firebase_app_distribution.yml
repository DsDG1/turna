name: Firebase App Distribution

# Builds a releasable arm64 APK (via tool/build_release.py, including
# libturna_anki.so) and uploads it to Firebase App Distribution.
# One-time Console + GitHub Secrets setup: docs/firebase-app-distribution.md

on:
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version string (e.g. 0.8.0). Defaults to the pubspec version plus the run number.
        required: false
        type: string
      groups:
        description: Firebase App Distribution tester group names (comma-separated)
        required: false
        type: string
        default: testers
      release_notes:
        description: Short release notes shown to testers. Defaults to the latest commit subject.
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: firebase-app-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check required Firebase secrets
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${FIREBASE_APP_ID:-}" ]; then
            echo "Missing GitHub secret FIREBASE_APP_ID." >&2
            missing=1
          fi
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "Missing GitHub secret FIREBASE_SERVICE_ACCOUNT." >&2
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "See docs/firebase-app-distribution.md for one-time Console + Secrets setup." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Fetch pinned protoc
        run: bash native/turna_anki_core/build-android/fetch_protoc.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read Flutter version
        run: flutter --version

      - name: Verify project config
        run: flutter config --no-analytics

      - name: Resolve version and release notes
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
          INPUT_GROUPS: ${{ github.event.inputs.groups }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            PUBSPEC_VERSION="$(python3 -c "import re; print(re.search(r'^version:\s*(\S+)', open('pubspec.yaml').read(), re.M).group(1))")"
            VERSION="${PUBSPEC_VERSION}-dist.${GITHUB_RUN_NUMBER}"
          fi
          python3 - "$VERSION" <<'PY'
          import sys
          sys.path.insert(0, "tool")
          import build_release
          build_release.validate_version(sys.argv[1])
          PY

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_NOTES:-}" ]; then
            NOTES="${INPUT_NOTES}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NOTES="Turna ${VERSION} (${GITHUB_SHA::7})"
          else
            NOTES="$(git log -1 --pretty=format:%s)"
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_GROUPS:-}" ]; then
            GROUPS="${INPUT_GROUPS}"
          else
            GROUPS="testers"
          fi

          NOTES_FILE="${RUNNER_TEMP}/firebase-release-notes.txt"
          printf '%s\n' "${NOTES}" > "${NOTES_FILE}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "groups=${GROUPS}" >> "${GITHUB_OUTPUT}"
          echo "notes_file=${NOTES_FILE}" >> "${GITHUB_OUTPUT}"
          echo "apk_path=build/releases/${VERSION}/turna-v${VERSION}-release.apk" >> "${GITHUB_OUTPUT}"
          echo "Resolved version=${VERSION} groups=${GROUPS}"
          echo "Release notes:"
          cat "${NOTES_FILE}"

      - name: Configure optional release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret; release APK will use the debug signing config (existing local/CI fallback)."
            exit 0
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is set, but ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD are incomplete." >&2
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/turna-upload-keystore.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          {
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storeFile=${KEYSTORE_PATH}"
          } > android/key.properties
          echo "Wrote android/key.properties (release signing)."

      - name: Build native Official Anki core
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          (cd native/turna_anki_core && rustup target add aarch64-linux-android)
          bash native/turna_anki_core/build-android/build.sh

      - name: Build release APK
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' android/gradle.properties
          python3 tool/build_release.py \
            --version "${{ steps.meta.outputs.version }}" \
            --skip-web \
            --skip-aab \
            --skip-content-validation

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ steps.meta.outputs.groups }}
          file: ${{ steps.meta.outputs.apk_path }}
          releaseNotesFile: ${{ steps.meta.outputs.notes_file }}

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: turna-v${{ steps.meta.outputs.version }}-release
          path: ${{ steps.meta.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
