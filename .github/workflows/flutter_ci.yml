name: Flutter CI

on:
  push:
    branches:
      - master
    paths:
      - "lib/**"
      - "test/**"
      - "tool/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "build.yaml"
      - "Makefile"
      - ".github/workflows/flutter_ci.yml"
  pull_request:
    branches:
      - master
    paths:
      - "lib/**"
      - "test/**"
      - "tool/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "build.yaml"
      - "Makefile"
      - ".github/workflows/flutter_ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tool/gui/pyproject.toml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pubspec pins Dart SDK >=3.2.3 <4.0.0; pin the exact stable
          # Flutter the project is developed against so CI does not drift
          # between runs. Bump deliberately via PR.
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Read Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify project config
        run: flutter config --no-analytics

      - name: Format check
        # Runs before build_runner so only committed sources are checked.
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Generate code (routes, freezed, drift, injectable)
        # Generated files (freezed/.g/.gr/injection.config.dart) are all
        # committed (the .gitignore rules for them are commented out), so
        # this step is a redundant-but-harmless regeneration; the drift gate
        # below then verifies the committed copies match what the toolchain
        # would produce.
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Verify generated code is in sync
        # Regeneration must be a no-op on committed sources. A diff here
        # means someone edited a generated file by hand or forgot to re-run
        # build_runner after changing an annotated source.
        run: git diff --exit-code lib/ || (echo '::error::generated code drift' && exit 1)

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        # Golden tests render with runner-local fonts and only pass on the
        # machine that generated the goldens (the project's canonical green
        # run is `flutter test --exclude-tags golden` — see test/BASELINE.md).
        # They are regenerated deliberately by the responsible person.
        run: flutter test --coverage --exclude-tags golden

      - name: Coverage summary
        # Floor: 55% with ~3pt of headroom over the current ~58%. Lowering
        # the floor is a decision, not an accident.
        run: |
          python3 - <<'EOF'
          lf = lh = 0
          for line in open("coverage/lcov.info", encoding="utf-8"):
              if line.startswith("LF:"):
                  lf += int(line.split(":", 1)[1])
              elif line.startswith("LH:"):
                  lh += int(line.split(":", 1)[1])
          pct = 100.0 * lh / lf if lf else 0.0
          print(f"TOTAL line coverage: {lh}/{lf} = {pct:.1f}%")
          floor = 55.0
          if pct < floor:
              print(f"::error::line coverage {pct:.1f}% is below the {floor:.0f}% floor")
              raise SystemExit(1)
          EOF

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-info
          path: coverage/lcov.info

      - name: Install Qt system libraries for headless GUI tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install GUI editor dependencies
        # [ocr] pulls Pillow/pytesseract/PyMuPDF: test_experience_ocr runs in
        # the full tier and imports PIL directly.
        run: python3 -m pip install "./tool/gui[dev,ocr]"

      - name: Configure git identity for GUI library tests
        # Runner images ship no global git identity; test_git_library's
        # commit/push roundtrip needs one.
        run: |
          git config --global user.name "turna-ci"
          git config --global user.email "ci@turna.invalid"

      - name: Lint GUI editor (ruff)
        run: ruff check tool/gui

      - name: Run GUI editor tests (full tier)
        working-directory: tool/gui
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 run_gui_tests.py full -j 4

      - name: Run Python tool tests
        run: python3 -m unittest discover -s test -p "*_test.py"

      - name: Build release smoke test
        # Web is skipped because CI does not need the web artifact; content
        # validation is skipped here because course_validation.yml already
        # validates course assets on content changes.
        run: python3 tool/build_release.py --version ci-smoke --skip-web --skip-content-validation
