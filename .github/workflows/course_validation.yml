name: Course Content Validation

on:
  push:
    branches:
      - master
    paths:
      - "assets/courses/**"
      - "docs/authoring/**"
      - "tool/course_*.py"
      - "tool/export_author_workspace.py"
      - "test/*_cli_test.py"
      - ".github/workflows/course_validation.yml"
  pull_request:
    branches:
      - master
    paths:
      - "assets/courses/**"
      - "docs/authoring/**"
      - "tool/course_*.py"
      - "tool/export_author_workspace.py"
      - "test/*_cli_test.py"
      - ".github/workflows/course_validation.yml"

permissions:
  contents: read

jobs:
  validate-course:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate course JSON
        run: python tool/course_cli.py validate

      - name: Lint course content
        # Strict mode is enabled after the pending real listening audio is delivered.
        run: python tool/course_cli.py lint

      - name: Run Python CLI and authoring-contract tests
        run: python -m unittest discover -s test -p "*_cli_test.py"
