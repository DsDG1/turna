name: Official Anki

on:
  push:
    paths:
      - "native/turna_anki_core/**"
      - "lib/application/anki_official/**"
      - "test/application/anki_official/**"
      - "test/fixtures/anki_official/**"
      - "ios/**"
      - ".github/workflows/official_anki.yml"
  pull_request:
    paths:
      - "native/turna_anki_core/**"
      - "lib/application/anki_official/**"
      - "test/application/anki_official/**"
      - "test/fixtures/anki_official/**"
      - "ios/**"
      - ".github/workflows/official_anki.yml"

permissions:
  contents: read

jobs:
  official-anki-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch pinned protoc
        run: bash native/turna_anki_core/build-android/fetch_protoc.sh
      - name: Verify pin and patch
        run: bash native/turna_anki_core/build-android/verify_pin.sh
      - name: Host fmt clippy test
        working-directory: native/turna_anki_core
        env:
          PROTOC: ${{ github.workspace }}/native/turna_anki_core/tools/protoc/bin/protoc
          PROTOC_BINARY: ${{ github.workspace }}/native/turna_anki_core/tools/protoc/bin/protoc
        run: bash build-android/host-test.sh
      - name: Build host cdylib for Dart FFI tests
        # `cargo test` links the lib as an rlib and never produces the
        # cdylib artifact; the FFI integration step below loads
        # target/debug/libturna_anki.so, so build it explicitly.
        working-directory: native/turna_anki_core
        env:
          PROTOC: ${{ github.workspace }}/native/turna_anki_core/tools/protoc/bin/protoc
          PROTOC_BINARY: ${{ github.workspace }}/native/turna_anki_core/tools/protoc/bin/protoc
        run: cargo build
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true
      - name: Host Dart FFI integration
        env:
          TURNA_ANKI_REQUIRE_NATIVE: "1"
          TURNA_ANKI_LIB: ${{ github.workspace }}/native/turna_anki_core/target/debug/libturna_anki.so
        run: flutter test test/application/anki_official/official_anki_host_ffi_test.dart

  official-anki-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true
      - run: flutter pub get
      - run: dart analyze lib/application/anki_official
      - run: flutter test test/application/anki_official

  official-anki-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Fetch pinned protoc
        run: bash native/turna_anki_core/build-android/fetch_protoc.sh
      - name: Build arm64 .so
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          (cd native/turna_anki_core && rustup target add aarch64-linux-android)
          bash native/turna_anki_core/build-android/build.sh
      - name: Inspect .so
        run: |
          so=android/app/src/main/jniLibs/arm64-v8a/libturna_anki.so
          test -f "$so"
          llvm-readelf -d "$so" || readelf -d "$so"
          nm -D "$so" | grep turna_anki_abi_version
          stat -c '%s %n' "$so"
          sha256sum "$so"

  official-anki-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch pinned protoc
        run: bash native/turna_anki_core/build-android/fetch_protoc.sh
      - name: Build TurnaAnki.xcframework
        # Targets must be added from inside the crate so rustup applies them
        # to the rust-toolchain.toml-pinned toolchain, not the default one.
        run: |
          (cd native/turna_anki_core && rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios)
          bash native/turna_anki_core/build-ios/build.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true
      - name: Build iOS app (no codesign)
        # Links the freshly built xcframework end-to-end; --no-codesign keeps
        # the gate free of provisioning/signing secrets.
        run: |
          flutter pub get
          flutter build ios --no-codesign
