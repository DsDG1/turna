[package]
name = "turna_anki_bridge"
version = "0.0.1"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
rust-version = "1.80"
description = "Turna C ABI around a pinned official Anki rslib"

[lib]
name = "turna_anki"
path = "bridge/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Repository-relative paths only. Do not point Cargo at /home/.../anki.
# This package is intentionally NOT a Cargo workspace: anki/rslib belongs
# to the upstream Anki workspace and cannot be a member of ours.
anki = { path = "anki/rslib" }
anki_proto = { path = "anki/rslib/proto" }

# Anki's workspace enables tokio features via other members (axum, sync
# binary). Building rslib alone does not unify `io-util`, which
# Collection/sync code requires. Enabling it here is not an Anki patch.
tokio = { version = "1.45", features = ["fs", "rt-multi-thread", "macros", "signal", "io-util"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = "0.36"
regex = "1"
# Pinned to the exact version anki/rslib uses — its comment warns "any
# changes could invalidate sqlite indexes". The bridge registers this
# collation on raw connections that must rebuild rslib's `COLLATE
# unicase` b-trees (VACUUM in compact_collection).
unicase = "=2.6.0"

[[bin]]
name = "turna_anki_gen_fixtures"
path = "tools/gen_fixtures.rs"
