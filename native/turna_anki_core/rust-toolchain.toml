[toolchain]
# Must match the pinned Anki rust-toolchain.toml.
# Older versions may fail to compile; newer versions may fail clippy.
channel = "1.97.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
# aarch64-linux-android is installed explicitly in P0-003.
# Listing it here would force every host cargo invocation to download
# the Android std before tests can run.
